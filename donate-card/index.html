<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donate Card Overlay</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="donate-card" id="donateCard">
    <div class="donate-top">
      <div class="badge-pill">
        <span class="pulse-dot"></span>
        <span>NEW SUPPORT</span>
      </div>
      <span class="donate-platform" id="donatePlatform">SociaBuzz</span>
    </div>

    <div class="donate-main">
      <div class="donor-name" id="donorName">Nama Donatur</div>
      <div class="donate-amount" id="donateAmount">Rp 0</div>
    </div>

    <div class="donate-message" id="donateMessage">
      Pesan dukungan akan tampil di sini.
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
